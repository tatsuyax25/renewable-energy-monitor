<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renewable Energy Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌱 Renewable Energy Dashboard</h1>
    <div class="real-time-indicator">
      <span class="status-dot"></span>
      <span>Live Data</span>
    </div>
  </header>

  <main>
    <section class="metrics-grid">
      <div class="metric-card">
        <h3>Current Solar</h3>
        <div class="metric-value" id="currentSolar">--</div>
        <span class="metric-unit">kWh</span>
      </div>
      <div class="metric-card">
        <h3>Consumption</h3>
        <div class="metric-value" id="currentConsumption">--</div>
        <span class="metric-unit">kWh</span>
      </div>
      <div class="metric-card">
        <h3>Net Energy</h3>
        <div class="metric-value" id="netEnergy">--</div>
        <span class="metric-unit">kWh</span>
      </div>
      <div class="metric-card">
        <h3>CO₂ Saved</h3>
        <div class="metric-value" id="carbonSaved">--</div>
        <span class="metric-unit">kg</span>
      </div>
    </section>

    <section class="charts-section">
      <div class="chart-container">
        <h2>Monthly Overview</h2>
        <canvas id="energyChart"></canvas>
      </div>
      <div class="chart-container">
        <h2>Weekly Analytics</h2>
        <canvas id="analyticsChart"></canvas>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.8.0/dist/chart.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
